name: Publish AI Marketing Daily

on:
  schedule:
    # 09:00 IST = 03:30 UTC. GitHub scheduled workflows may start a few minutes late.
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Research and write today's edition
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python scripts/generate_news.py

      - name: Commit today's edition
        run: |
          git config user.name "AI Marketing Daily Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No content changes to commit."
          else
            git commit -m "Publish daily AI marketing edition"
            git push
          fi
